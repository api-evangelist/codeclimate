specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Code Climate
providerId: codeclimate
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Code Quality
- Static Analysis
- Test Coverage
- Engineering Analytics
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Code Climate (Qlty Cloud) spend. Code Climate bills on a
  per-contributor seat basis across Free, Pro, and Enterprise tiers, with
  monthly analysis-minute and AI-autofix allotments per plan. Cost is
  driven primarily by the number of active contributing seats and the
  selected tier rather than by per-API-call charges; the REST API is
  included with the product.
notes: >-
  Per-contributor seat prices and analysis-minute allotments are subject to
  change; verify against the live Qlty pricing page during reconciliation.
sources:
- https://codeclimate.com/quality/pricing
- https://qlty.sh/pricing
- https://docs.codeclimate.com/docs/billing-faq
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Code Climate
serviceCategory: Developer Tools
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Code Climate Quality
  ServiceCategory: Developer Tools
  ProviderName: Code Climate
  PublisherName: Code Climate
  InvoiceIssuerName: Code Climate
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription-Based
meters:
- name: contributor_seats
  description: Active contributing seats billed per contributor per month by plan.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: analysis_minutes
  description: Analysis minutes consumed against the per-plan monthly allotment.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - repo
- name: ai_autofixes
  description: AI autofixes consumed against the per-plan monthly allotment.
  unit: autofixes
  aggregation: sum
  dimensions:
  - account
  - repo
principles:
- name: Visibility
  description: Track active contributor seats and per-repo analysis-minute consumption against plan allotments.
- name: Allocation
  description: Map seats and repositories to teams and cost centers; tag analysis usage by repo.
- name: Optimization
  description: Right-size the plan to active contributors; use the free open source / education tiers where eligible; pay annually for two months free.
- name: Accountability
  description: Review seat counts and analysis-minute burn monthly; reconcile against budget before renewal.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
